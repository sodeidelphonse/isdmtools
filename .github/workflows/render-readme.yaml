on:
  push:
    paths:
      - README.Rmd
      - R/*
      - DESCRIPTION

name: Render README

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev gdal-bin libgdal-dev libproj-dev libudunits2-dev

      # Build environment purely from DESCRIPTION and required tools
      - name: Install Infrastructure and Dependencies
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://posit.co"))' \
                  -e 'install.packages(c("callr", "remotes", "rmarkdown", "knitr"))' \
                  -e 'remotes::install_local(".", dependencies = TRUE, upgrade = "never")'

      - name: Render README
        run: Rscript -e 'rmarkdown::render("README.Rmd")'

      - name: Commit results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@://github.com"
          git add README.md man/figures/* || echo "No files to add"
          git commit -m 'Re-build README.Rmd [skip ci]' || echo "No changes to commit"
          git push origin || echo "No changes to push"
